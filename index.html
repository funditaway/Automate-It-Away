<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automate It Away</title>
  <meta name="description" content="Your desk runs. You tap the exceptions.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0d6b6b">
  <script>
  (function(){var t=localStorage.getItem('aia_theme')||'system';var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);})();
  </script>
  <link rel="stylesheet" href="theme.css">
  <style>
    body{font-family:system-ui,Segoe UI,sans-serif;margin:0;color:var(--ink);background:var(--bg)}
    a{color:inherit;text-decoration:none}
    header{background:linear-gradient(135deg,#0f7f7f,#0d6b6b);color:#fff;padding:14px 5vw;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
    nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
    .wrap{width:min(720px,92vw);margin:0 auto;padding:28px 0 40px}
    h1{font-size:clamp(1.8rem,5vw,2.6rem);color:var(--heading);line-height:1.15;margin:0 0 10px}
    .lead{color:var(--muted);font-size:1.15rem;margin:0 0 18px}
    .shot{width:100%;border-radius:16px;border:1px solid var(--line);display:block;margin:0 0 18px}
    .btn{display:inline-block;padding:14px 18px;border-radius:10px;font-weight:700;background:var(--orange);color:#fff}
    .quiet{margin-left:10px;color:var(--teal);font-weight:700}
    footer{padding:18px 5vw 28px;color:var(--muted);font-size:14px}
    footer a{color:var(--teal)}
  </style>
</head>
<body>
<header>
  <strong>Automate It Away</strong>
  <nav>
    <a href="/how">How</a>
    <a href="/setup">Setup</a>
    <a href="/desk">Desk</a>
    <a href="/login">Sign in</a>
    <a href="/onboard.html">Open your desk</a>
    <button class="theme-btn" data-theme-btn type="button" onclick="AIATheme.cycle()">Auto</button>
  </nav>
</header>
<main class="wrap">
  <h1>Automate It Away</h1>
  <p class="lead">Your desk runs. You tap the exceptions.</p>
  <img class="shot" src="/img/home-counter.png" alt="Desk counter with a phone showing yes or no. No people.">
  <p>
    <a class="btn" href="/onboard.html">Open your desk</a>
    <a class="quiet" href="/how">See how</a>
  </p>
</main>
<footer>
  © 2026 Automate It Away ·
  <a href="/how">How</a> ·
  <a href="/setup">Setup</a> ·
  <a href="/help">Help</a> ·
  <a href="/legal">Legal</a> ·
  <a href="/status">Status</a>
</footer>
<script src="theme.js"></script>
<script src="analytics.js"></script>
</body>
</html>
