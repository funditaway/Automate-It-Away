<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pipes · Automate It Away</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0d6b6b">
  <script>
  (function(){var t=localStorage.getItem('aia_theme')||'system';var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);})();
  </script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="desk-nav.css">
  <script src="theme.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    a{color:inherit;text-decoration:none}
    header{background:linear-gradient(135deg,#0f7f7f,#0d6b6b);color:#fff;padding:12px 4vw;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
    .desk-tabs{width:100%;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 10px;padding-top:8px;font:700 13px/1.2 system-ui,sans-serif}
    .desk-tabs a{color:#fff}
    body.has-desk-nav{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
    #desk-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:#0d6b6b;color:#fff;padding:8px 4px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(10,79,79,.22)}
    #desk-nav a{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.92);font:700 12px/1.1 system-ui,sans-serif;text-decoration:none}
    #desk-nav a.on{color:#f39c12}
    #desk-nav svg{width:22px;height:22px;display:block}
    .wrap{width:min(720px,94vw);margin:0 auto;padding:16px 0 24px}
    h1{color:var(--heading);font-size:1.4rem;margin:0 0 8px}
    p{color:var(--muted);margin:0 0 12px}
    .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
    .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    input,select{padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
    button,.btn{border:0;border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--edit);color:var(--edit-ink)}
    .go{background:#119494;color:#fff}
    .pipe{display:flex;justify-content:space-between;gap:8px;align-items:center}
    .meta{font-size:12px;color:var(--muted)}
    .up{color:#119494}.hold{color:#c27b0e}.down{color:#b33}
  </style>
</head>
<body class="has-desk-nav">
  <header>
    <a href="index.html"><strong>Automate It Away</strong></a>
    <button class="theme-btn" data-theme-btn type="button" onclick="AIATheme.cycle()">Auto</button>
    <nav class="desk-tabs" aria-label="Desk tabs">
      <a href="/desk" data-tab="queue">Queue</a>
      <a href="/onboard" data-tab="drop">Drop</a>
      <a href="/rules" data-tab="rules">Rules</a>
      <a href="/connections" data-tab="pipes">Pipes</a>
      <a href="/more" data-tab="more">More</a>
    </nav>
  </header>
  <main class="wrap">
    <h1>This desk’s pipes.</h1>
    <p>The queue works with a note. Add a pipe only if you want calendar, a text, or a webhook.</p>
    <div class="item">
      <div class="row">
        <input id="ws" placeholder="Desk name">
        <input id="pin" placeholder="Desk code" inputmode="numeric" style="width:110px">
        <button class="go" type="button" onclick="listPipes()">Show pipes</button>
      </div>
    </div>
    <div id="pipes"></div>
    <div class="item">
      <p class="meta">Add one</p>
      <div class="row">
        <select id="prov">
          <option value="webhook">Webhook</option>
          <option value="calendar">Phone / Google calendar</option>
          <option value="sms">SMS</option>
          <option value="consign">Consign store</option>
          <option value="square">Square</option>
          <option value="ebay">eBay</option>
        </select>
        <input id="hook" placeholder="Webhook URL if you picked that">
        <button class="go" type="button" onclick="connect()">Connect</button>
      </div>
      <p class="meta" style="margin-top:8px">The queue still takes work if a pipe is not live.</p>
      <p class="meta" id="inbound"></p>
    </div>
    <p class="meta"><a href="desk.html">Back to the queue</a></p>
  </main>
  <nav id="desk-nav" aria-label="Desk">
    <a href="/desk" data-tab="queue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Queue</span></a>
    <a href="/onboard" data-tab="drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Drop</span></a>
    <a href="/rules" data-tab="rules"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h8M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Rules</span></a>
    <a href="/connections" data-tab="pipes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8h10M7 16h10M5 12h2m10 0h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Pipes</span></a>
    <a href="/more" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h.01M12 12h.01M18 12h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>More</span></a>
  </nav>
  <script src="analytics.js"></script>
  <script src="desk-nav.js"></script>
  <script>
    const wsEl = document.getElementById("ws");
    const pinEl = document.getElementById("pin");
    if (localStorage.getItem("aia_ws")) wsEl.value = localStorage.getItem("aia_ws");
    if (localStorage.getItem("aia_pin")) pinEl.value = localStorage.getItem("aia_pin");
    function headers() {
      const h = { "Content-Type": "application/json", "X-Workspace": wsEl.value || "demo" };
      if (pinEl.value) h["X-Pin"] = pinEl.value;
      return h;
    }
    async function listPipes() {
      if (wsEl.value) localStorage.setItem("aia_ws", wsEl.value);
      const r = await fetch("/api/connections", { headers: headers() });
      const data = await r.json();
      const catalog = data.catalog || [];
      const mine = data.connections || [];
      const inbound = data.inbound || ("https://automateitaway.com/api/hook?workspace=" + encodeURIComponent(wsEl.value || "demo"));
      document.getElementById("inbound").textContent = "Write back URL: " + inbound;
      document.getElementById("pipes").innerHTML = catalog.map(p => {
        const on = mine.find(c => c.provider === p.id);
        const st = on ? on.status : p.status;
        const cls = st === "live" ? "up" : st === "down" ? "down" : "hold";
        return "<div class=\"item pipe\"><div><b>" + p.label + "</b><div class=\"meta " + cls + "\">" + (on ? "On this desk · " : "Not added · ") + st + "</div></div></div>";
      }).join("");
    }
    async function connect() {
      const provider = document.getElementById("prov").value;
      const hook = document.getElementById("hook").value || undefined;
      await fetch("/api/connections", { method: "POST", headers: headers(), body: JSON.stringify({ provider, hook }) });
      listPipes();
    }
    listPipes();
  </script>
</body>
</html>
