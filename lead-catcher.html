<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lead Catcher · Automate It Away</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0d6b6b">
  <script>
  (function(){var t=localStorage.getItem('aia_theme')||'system';var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);})();
  </script>
  <link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="/phone-clear.css">
  <link rel="stylesheet" href="desk-nav.css">
  <script src="theme.js"></script>
  <style>
    body{margin:0}
    header{background:var(--header);color:#fff;padding:12px 4vw;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
    header a{color:#fff;text-decoration:none}
    .wrap{width:min(1180px,96vw);margin:0 auto;padding:14px 0 90px}
    h1{font-size:1.4rem;margin:0 0 6px;color:var(--heading)}
    h2{font-size:1.1rem;margin:0 0 6px;color:var(--heading)}
    h3{font-size:.95rem;margin:16px 0 6px;color:var(--heading)}
    p{color:var(--muted);margin:0 0 10px}
    .note{background:var(--card);border:1px solid var(--line);border-left:4px solid #075756;border-radius:10px;padding:8px 12px;font-size:.9rem}
    .lc-grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:12px;margin-top:10px}
    @media (max-width:860px){.lc-grid{grid-template-columns:1fr}}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;overflow:auto}
    .views{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
    .views button,.btn{border:1px solid #075756;background:transparent;color:var(--heading);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;min-height:40px}
    .views button.on,.btn.primary{background:#075756;color:#fff}
    .btn.stop{border-color:#B42318;color:#B42318}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
    .filters input,.filters select,.grid input,.grid select,textarea{padding:8px;border:1px solid var(--line);border-radius:8px;width:100%;font:inherit;background:var(--card);color:inherit}
    .filters input{grid-column:1/-1}
    .row{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
    .row.sel,.row:hover{border-color:#075756}
    .row .req{color:var(--muted);font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:#E3F1F0;color:#075756;text-transform:uppercase;margin-right:4px}
    .tag.demo{background:#FFF1E6;color:#8A3B0A}.tag.test{background:#EEF0FF;color:#2F3A8F}.tag.mock{background:#0D1216;color:#fff}
    .tag.urg-emergency,.tag.late{background:#FDE8E8;color:#B42318}.tag.urg-high{background:#FFF4D6;color:#9A6700}
    .orig{background:rgba(7,87,86,.07);border-left:4px solid #075756;padding:8px 10px;white-space:pre-wrap;border-radius:6px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
    .grid label{font-size:12px;color:var(--muted);display:block}
    textarea{min-height:110px}
    .flags span{display:inline-block;margin:2px 4px 2px 0;font-size:12px;background:#FFF4D6;color:#9A6700;border-radius:6px;padding:2px 6px}
    .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .hist{list-style:none;padding:0;margin:0}.hist li{border-left:3px solid var(--line);padding:4px 8px;margin-bottom:6px;font-size:13px}
    .msg{padding:8px 10px;border-radius:8px;margin:8px 0;display:none}.msg.err{display:block;background:#FDE8E8;color:#B42318}.msg.ok{display:block;background:#E3F1F0;color:#075756}
    .hash{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);word-break:break-all}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.metrics div{border:1px solid var(--line);border-radius:8px;padding:8px}.metrics b{display:block;font-size:20px;color:var(--heading)}
  </style>
</head>
<body class="has-desk-nav">
  <header>
    <a class="brand" href="index.html"><img class="brand-mark" src="img/aia-pyramid-header.svg" width="28" height="28" alt=""><span class="brand-name">Automate It Away</span></a>
    <button class="theme-btn" data-theme-btn type="button" onclick="AIATheme.cycle()">Auto</button>
    <nav class="desk-tabs" aria-label="Desk tabs">
      <a href="/desk" data-tab="queue">Queue</a>
      <a href="/drop" data-tab="drop">Drop</a>
      <a href="/create" data-tab="create">Create</a>
      <a href="/history" data-tab="history">History</a>
      <a href="/more" data-tab="more">More</a>
    </nav>
  </header>
  <main class="wrap">
    <h1><img src="img/aia-mark-teal.png" width="28" height="28" alt="" style="vertical-align:middle;border-radius:6px"> Lead Catcher</h1>
    <p class="note">Official AIA Pack · preview. Replies go to a <b>test outbox</b>. Nothing is sent to customers and nothing is charged.</p>
    <section class="panel" id="gate" style="margin-top:10px"><p>Checking this desk…</p></section>
    <div class="lc-grid" id="deskArea" hidden>
      <section class="panel" aria-label="Lead Catcher cards">
        <div class="views" id="views">
          <button data-v="active" class="on">Open</button><button data-v="unassigned">No owner</button><button data-v="overdue">Late</button>
          <button data-v="waiting">Waiting</button><button data-v="mine">Mine</button><button data-v="done">Done</button><button data-v="numbers">Numbers</button>
        </div>
        <div class="filters">
          <input id="q" type="search" placeholder="Search words, name, phone, email">
          <select id="category"><option value="">Any kind of job</option><option>plumbing</option><option>hvac</option><option>electrical</option><option>roofing</option><option>restoration</option><option>other</option></select>
          <select id="urgency"><option value="">Any urgency</option><option>emergency</option><option>high</option><option>normal</option><option>low</option></select>
          <select id="label"><option value="">Test and demo</option><option value="demo">Demo only</option><option value="test">Test only</option></select>
          <select id="sort"><option value="arrived_desc">Newest first</option><option value="arrived_asc">Oldest first</option><option value="due_asc">Due soonest</option><option value="urgency">Most urgent</option></select>
        </div>
        <button class="btn" id="newBtn" type="button">+ Type in a request</button>
        <div id="list" style="margin-top:8px"></div>
      </section>
      <section class="panel" id="detail" aria-label="Card"><p>Pick a card.</p></section>
    </div>
  </main>
  <nav id="desk-nav" aria-label="Desk">
    <a href="/desk" data-tab="queue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Queue</span></a>
    <a href="/drop" data-tab="drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Drop</span></a>
    <a href="/create" data-tab="create"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h9l5 5v11H5zM14 4v5h5M8 13h8M8 17h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Create</span></a>
    <a href="/history" data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>History</span></a>
    <a href="/more" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h.01M12 12h.01M18 12h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>More</span></a>
  </nav>
  <script src="desk-nav.js"></script>
  <script src="/mark-fix.js"></script>
  <script src="lead-catcher.js"></script>
</body>
</html>
