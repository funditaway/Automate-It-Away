<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How · Automate It Away</title>
  <meta name="description" content="Photo in. We comps or we kill it. You get a draft. You tap payout, Kill, or a live list.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0d6b6b">
  <script>
  (function(){var t=localStorage.getItem('aia_theme')||'system';var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);})();
  </script>
  <link rel="stylesheet" href="theme.css">
  <style>
    body{font-family:system-ui,Segoe UI,sans-serif;margin:0;color:var(--ink);background:var(--bg)}
    a{color:inherit;text-decoration:none}
    header{background:linear-gradient(135deg,#0f7f7f,#0d6b6b);color:#fff;padding:14px 5vw;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
    nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
    header a{color:#fff}
    .wrap{width:min(720px,92vw);margin:0 auto;padding:28px 0 40px}
    h1{font-size:clamp(1.6rem,4.6vw,2.2rem);color:var(--heading);line-height:1.15;margin:0 0 10px}
    .lead{color:var(--muted);font-size:1.1rem;margin:0 0 18px;max-width:36rem}
    .shot{width:100%;border-radius:16px;border:1px solid var(--line);display:block;margin:0 0 18px}
    .btn{display:inline-block;padding:14px 18px;border-radius:10px;font-weight:700;background:var(--orange);color:#fff}
    .note{margin-top:16px;font-size:14px;color:var(--muted)}
  </style>
</head>
<body>
<header>
  <a href="/"><strong>Automate It Away</strong></a>
  <nav>
    <a href="/setup">Setup</a>
    <a href="/onboard.html">Open your desk</a>
    <a href="/desk">Desk</a>
    <button class="theme-btn" data-theme-btn type="button" onclick="AIATheme.cycle()">Auto</button>
  </nav>
</header>
<main class="wrap">
  <h1>How it works</h1>
  <p class="lead">Photo in. We comps or we kill it. You get a draft. You tap payout, Kill, or a live list.</p>
  <img class="shot" src="/img/how-lots.png" alt="Lots on a counter with blank tags. No people.">
  <p><a class="btn" href="/onboard.html">Open your desk</a></p>
  <p class="note">eBay stays on hold. Whatnot stays off. Nothing lists until you tap.</p>
</main>
<script src="theme.js"></script>
<script src="analytics.js"></script>
</body>
</html>
