<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Support · Automate It Away</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
  (function(){var t=localStorage.getItem('aia_theme')||'system';var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);})();
  </script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="desk-nav.css">
  <script src="theme.js"></script>
  <script src="analytics.js"></script>
<style>
body{font-family:system-ui;margin:0;background:var(--bg);color:var(--ink)}
a{color:var(--teal)}
header{padding:16px 5vw;border-bottom:1px solid var(--line);background:#0d6b6b;color:#fff;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff}
.hero{text-align:center;padding:48px 5vw 24px}
input,textarea{width:min(640px,90vw);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.panel{width:min(640px,92vw);margin:0 auto 24px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
button.go{padding:10px 16px;border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:700}
</style>
</head>
<body class="has-desk-nav">
<header>
  <a href="index.html">AUTOMATE IT AWAY</a>
  <button class="theme-btn" data-theme-btn type="button" onclick="AIATheme.cycle()">Auto</button>
  <nav class="desk-tabs" aria-label="Desk tabs">
    <a href="/desk" data-tab="queue">Queue</a>
    <a href="/onboard" data-tab="drop">Drop</a>
    <a href="/rules" data-tab="rules">Rules</a>
    <a href="/connections" data-tab="pipes">Pipes</a>
    <a href="/more" data-tab="more">More</a>
  </nav>
</header>
<section class="hero"><p>HELP CENTER</p><h1>Support</h1>
<p><input id="q" placeholder="Search support articles"></p>
</section>
<div class="panel">
<p><b>You only tap exceptions.</b> Yes or no.</p>
<p><b>Pipes</b> are optional. The queue still takes work.</p>
</div>
<div class="panel">
<h2>Ticket</h2>
<p><input id="title" placeholder="Title"></p>
<p><textarea id="body" rows="4" placeholder="What happened"></textarea></p>
<p><button class="go" type="button" onclick="ticket()">Submit</button></p>
<p id="ok"></p>
</div>
<script>
function ticket(){const t=document.getElementById("title").value,b=document.getElementById("body").value;if(!t||!b){document.getElementById("ok").textContent="Title and description required.";return;}const all=JSON.parse(localStorage.getItem("aia_tickets")||"[]");all.unshift({title:t,body:b,t:Date.now()});localStorage.setItem("aia_tickets",JSON.stringify(all));document.getElementById("ok").textContent="Ticket saved on this device.";}
</script>
<nav id="desk-nav" aria-label="Desk">
  <a href="/desk" data-tab="queue"><span>Queue</span></a>
  <a href="/onboard" data-tab="drop"><span>Drop</span></a>
  <a href="/rules" data-tab="rules"><span>Rules</span></a>
  <a href="/connections" data-tab="pipes"><span>Pipes</span></a>
  <a href="/more" data-tab="more"><span>More</span></a>
</nav>
<script src="desk-nav.js"></script>
</body></html>
