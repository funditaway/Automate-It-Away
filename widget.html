<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop box · Automate It Away</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    a{color:inherit;text-decoration:none}
    header{background:linear-gradient(135deg,#0f7f7f,#0d6b6b);color:#fff;padding:12px 4vw;display:flex;justify-content:space-between;align-items:center}
    .wrap{width:min(880px,94vw);margin:0 auto;padding:18px 0 40px}
    h1{color:var(--heading);font-size:1.4rem}
    .sub{color:var(--muted);margin:4px 0 16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
    label{display:block;font-size:12px;font-weight:700;color:var(--heading);margin:10px 0 4px}
    .tip{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--edit);color:var(--edit-ink);font-size:11px;line-height:16px;text-align:center;cursor:help;margin-left:4px;vertical-align:middle}
    input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--card);color:var(--ink)}
    button{border:0;border-radius:10px;padding:10px 12px;background:var(--orange);color:#fff;font-weight:700;cursor:pointer;width:100%;margin-top:12px}
    pre{background:#1a2332;color:#e6f7f7;padding:12px;border-radius:10px;font-size:11px;overflow:auto;white-space:pre-wrap}
    .ok{margin-top:10px;color:#1b7a3d;font-size:14px;display:none}
    @media(max-width:720px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <a href="index.html"><strong>Automate It Away</strong></a>
    <span><a href="desk.html">Desk</a> · <button class="theme-btn" data-theme-btn type="button" onclick="AIATheme.cycle()">Auto</button></span>
  </header>
  <main class="wrap">
    <h1>Drop box</h1>
    <p class="sub">Customer photo and note land in your queue. They never see money or Stop.</p>
    <div class="grid">
      <div class="card">
        <strong style="color:var(--heading)">Send it in. We’ll handle the rest.</strong>
        <label>What is it?</label>
        <select id="kind">
          <option>Photo / item</option>
          <option>Call me back</option>
          <option>Quote request</option>
          <option>Book a job</option>
        </select>
        <label>Your name</label>
        <input id="who" placeholder="Taylor">
        <label>Phone or email</label>
        <input id="how" placeholder="417-555-0100">
        <label>Photo or PDF <span class="tip" title="Goes with the job. Keep it under 3.5MB.">?</span></label>
        <input id="photo" type="file" accept="image/*,application/pdf">
        <label>Notes</label>
        <textarea id="note" rows="3" placeholder="Lamp, needs pickup Thursday"></textarea>
        <button type="button" onclick="send()">Send to the shop</button>
        <p class="ok" id="ok">In the queue.</p>
      </div>
      <div class="card">
        <strong style="color:var(--heading)">Put this on your site</strong>
        <p class="sub">Copy onto any page. Items still land in this shop.</p>
        <pre id="embed"></pre>
        <button type="button" onclick="copyEmbed()">Copy</button>
      </div>
    </div>
  </main>
  <script>
    const ws = localStorage.getItem("aia_ws") || new URLSearchParams(location.search).get("ws") || "demo";
    if (new URLSearchParams(location.search).get("ws")) localStorage.setItem("aia_ws", ws);
    document.getElementById("embed").textContent =
      '<iframe src="https://automateitaway.com/widget?ws=' + ws + '" title="Shop drop box" style="width:100%;height:420px;border:0;border-radius:14px"></iframe>';
    async function send() {
      const ok = document.getElementById("ok");
      ok.style.display = "block";
      const item = {
        action: "capture",
        kind: document.getElementById("kind").value,
        title: document.getElementById("note").value || document.getElementById("kind").value,
        from: document.getElementById("who").value || "drop box",
        contactName: document.getElementById("who").value,
        phone: document.getElementById("how").value,
        notes: document.getElementById("note").value
      };
      const file = document.getElementById("photo").files[0];
      if (file) {
        if (file.size > 3500000) { ok.textContent = "Photo over 3.5MB."; return; }
        const data = await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.onerror = reject;
          r.readAsDataURL(file);
        });
        const up = await fetch("/api/upload", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Workspace": ws },
          body: JSON.stringify({ name: file.name, type: file.type, data })
        });
        const saved = await up.json();
        if (!up.ok) { ok.textContent = saved.error || "Photo did not save."; return; }
        item.photoUrl = saved.photoUrl;
      }
      const r = await fetch("/api/jobs", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Workspace": ws },
        body: JSON.stringify(item)
      });
      ok.textContent = r.ok ? "In the shop queue." : "Could not send.";
    }
    function copyEmbed() {
      navigator.clipboard.writeText(document.getElementById("embed").textContent);
      document.getElementById("ok").textContent = "Copied.";
      document.getElementById("ok").style.display = "block";
    }
  </script>
</body>
</html>
