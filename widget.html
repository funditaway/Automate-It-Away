<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0d6b6b">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Drop box · Automate It Away</title>
  <link rel="stylesheet" href="desk-nav.css">
  <style>
    :root { --teal-900:#0a4f4f;--teal-800:#0d6b6b;--orange-500:#f39c12;--gray-900:#1a2332;--gray-500:#6b7c8f;--gray-300:#d1dae3;--gray-100:#f4f7fa; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--gray-100);color:var(--gray-900)}
    a{color:inherit;text-decoration:none}
    header{background:linear-gradient(135deg,#0f7f7f,#0d6b6b);color:#fff;padding:12px 4vw;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
    body.has-desk-nav{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
    .desk-tabs{width:100%;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 10px;padding-top:8px;font:700 13px/1.2 system-ui,sans-serif}
    .desk-tabs a{color:#fff}
    #desk-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:#0d6b6b;color:#fff;padding:8px 4px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(10,79,79,.22)}
    #desk-nav a{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.92);font:700 12px/1.1 system-ui,sans-serif;text-decoration:none}
    #desk-nav svg{width:22px;height:22px;display:block}
    .wrap{width:min(880px,94vw);margin:0 auto;padding:18px 0 24px}
    h1{color:var(--teal-900);font-size:1.4rem}
    .sub{color:var(--gray-500);margin:4px 0 16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .card{background:#fff;border:1px solid var(--gray-300);border-radius:14px;padding:16px}
    label{display:block;font-size:12px;font-weight:700;color:var(--teal-900);margin:10px 0 4px}
    .tip{display:inline-block;width:16px;height:16px;border-radius:50%;background:#e6f7f7;color:#0a4f4f;font-size:11px;line-height:16px;text-align:center;cursor:help;margin-left:4px;vertical-align:middle}
    input,select,textarea{width:100%;padding:10px;border:1px solid var(--gray-300);border-radius:9px;font:inherit}
    button{border:0;border-radius:10px;padding:10px 12px;background:var(--orange-500);color:#fff;font-weight:700;cursor:pointer;width:100%;margin-top:12px}
    pre{background:#1a2332;color:#e6f7f7;padding:12px;border-radius:10px;font-size:11px;overflow:auto;white-space:pre-wrap}
    .ok{margin-top:10px;color:#1b7a3d;font-size:14px;display:none}
    @media(max-width:720px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body class="has-desk-nav">
  <header>
    <a href="index.html"><strong>Automate It Away</strong></a>
    <nav class="desk-tabs" aria-label="Desk tabs">
      <a href="/desk" data-tab="queue">Queue</a>
      <a href="/widget.html" data-tab="drop">Drop</a>
      <a href="/rules" data-tab="rules">Rules</a>
      <a href="/connections" data-tab="pipes">Pipes</a>
      <a href="/help" data-tab="more">More</a>
    </nav>
  </header>
  <main class="wrap">
    <h1 id="drop-title">Drop for this desk</h1>
    <p class="sub" id="drop-sub">This desk only.</p>
    <div class="grid">
      <div class="card">
        <strong style="color:var(--teal-900)">Send it in. We’ll handle the rest.</strong>
        <label>What is it?</label>
        <select id="kind">
          <option>School form / house note</option>
          <option>Photo / item</option>
          <option>Call me back</option>
          <option>Quote request</option>
          <option>Book a job</option>
        </select>
        <label>Your name</label>
        <input id="who" placeholder="Name">
        <label>Phone or email</label>
        <input id="how" placeholder="Phone or email">
        <label>Photo or PDF <span class="tip" title="Goes with the job. Keep it under 3.5MB.">?</span></label>
        <input id="photo" type="file" accept="image/*,application/pdf">
        <label>Notes</label>
        <textarea id="note" rows="3" placeholder="Lamp, needs pickup Thursday"></textarea>
        <button type="button" id="drop-send" onclick="send()">Send to the desk</button>
        <p class="ok" id="ok">In the queue.</p>
      </div>
      <div class="card">
        <strong style="color:var(--teal-900)">Put this on your site</strong>
        <p class="sub">Copy onto any page. This desk only.</p>
        <pre id="embed"></pre>
        <button type="button" onclick="copyEmbed()">Copy</button>
      </div>
    </div>
  </main>
  <nav id="desk-nav" aria-label="Desk">
    <a href="/desk" data-tab="queue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Queue</span></a>
    <a href="/widget.html" data-tab="drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Drop</span></a>
    <a href="/rules" data-tab="rules"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h8M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Rules</span></a>
    <a href="/connections" data-tab="pipes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8h10M7 16h10M5 12h2m10 0h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Pipes</span></a>
    <a href="/help" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h.01M12 12h.01M18 12h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>More</span></a>
  </nav>
  <script src="analytics.js"></script>
  <script src="desk-switch.js"></script>
  <script src="desk-nav.js"></script>
  <script>
    const desk = AIADesks.captureDesk();
    if (!desk || !desk.slug) { location.replace("/onboard"); }
    const ws = desk && desk.slug;
    const ruleId = (typeof URLSearchParams === "function" && new URLSearchParams(location.search).get("rule")) || "";
    let NOUNS = AIADesks.nounsOf();
    function paintDrop() {
      if (!desk) return;
      const cap = NOUNS.capture || "Capture";
      const name = desk.name || desk.slug;
      document.getElementById("drop-title").textContent = cap + " for " + name;
      document.getElementById("drop-sub").textContent = "This desk only.";
      const send = document.getElementById("drop-send");
      if (send) send.textContent = "Send to the desk";
      document.getElementById("embed").textContent =
        '<iframe src="https://automateitaway.com/widget?ws=' + ws + '" title="' + cap + " for " + name + '" style="width:100%;height:420px;border:0;border-radius:14px"></iframe>';
    }
    paintDrop();
    if (desk) {
      Promise.all([
        fetch("/api/auth", { headers: { "X-Workspace": ws } }).then((r) => r.json()).catch(function () { return {}; }),
        fetch("/api/jobs", { headers: { "X-Workspace": ws } }).then((r) => r.json()).catch(function () { return {}; })
      ]).then(function (pair) {
        const auth = pair[0] || {};
        const jobs = pair[1] || {};
        if (auth.workspace) {
          desk.name = auth.workspace.biz || auth.workspace.name || desk.name;
          if (auth.workspace.nouns) NOUNS = AIADesks.nounsOf(auth.workspace.nouns);
        }
        if (jobs.nouns) NOUNS = AIADesks.nounsOf(jobs.nouns);
        const rules = (jobs.rules || (auth.workspace && auth.workspace.rules) || []);
        const mine = ruleId && rules.find(function (r) { return r && r.id === ruleId; });
        if (mine && mine.widget && mine.widget.label) {
          document.getElementById("drop-sub").textContent = mine.widget.label + " · This desk only.";
        }
        paintDrop();
        if (mine && mine.widget && mine.widget.label) {
          document.getElementById("drop-sub").textContent = mine.widget.label + " · This desk only.";
        }
      }).catch(function () {});
    }
    async function send() {
      const ok = document.getElementById("ok");
      ok.style.display = "block";
      if (!ws) { location.replace("/onboard"); return; }
      const kind = document.getElementById("kind").value;
      const item = {
        action: "capture",
        kind,
        title: document.getElementById("note").value || kind,
        from: document.getElementById("who").value || "drop box",
        contactName: document.getElementById("who").value,
        phone: document.getElementById("how").value,
        notes: document.getElementById("note").value,
        pack: /school|house|form/i.test(kind) ? "home" : /photo|item/i.test(kind) ? "consign" : undefined
      };
      const file = document.getElementById("photo").files[0];
      if (file) {
        if (file.size > 3500000) { ok.textContent = "Photo over 3.5MB."; return; }
        const data = await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.onerror = reject;
          r.readAsDataURL(file);
        });
        const up = await fetch("/api/upload", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Workspace": ws },
          body: JSON.stringify({ name: file.name, type: file.type, data })
        });
        const saved = await up.json();
        if (!up.ok) { ok.textContent = saved.error || "Photo did not save."; return; }
        item.photoUrl = saved.photoUrl;
      }
      const r = await fetch("/api/jobs", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Workspace": ws },
        body: JSON.stringify(item)
      });
      ok.textContent = r.ok ? "In this desk’s queue." : "Could not send.";
    }
    function copyEmbed() {
      navigator.clipboard.writeText(document.getElementById("embed").textContent);
      document.getElementById("ok").textContent = "Copied.";
      document.getElementById("ok").style.display = "block";
    }
  </script>
</body>
</html>
