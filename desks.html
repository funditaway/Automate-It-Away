<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Desks · Automate It Away</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="desk-nav.css">
  <script src="theme.js"></script>
  <style>
    body{margin:0}
    header{background:var(--header);color:#fff;padding:12px 4vw}
    header a{color:#fff;text-decoration:none}
    .wrap{width:min(760px,94vw);margin:0 auto;padding:18px 0 24px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
    .meta,.muted{color:var(--muted);font-size:13px}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    button{border:0;border-radius:9px;padding:8px 12px;font-weight:700;min-height:44px;font:inherit}
    .go{background:var(--orange);color:#0c1116}
    .edit{background:var(--edit);color:var(--edit-ink)}
    .kill{background:var(--kill-bg);color:var(--kill-ink)}
    input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--card);color:var(--ink)}
    label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
    .edit-box{display:none;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
    .edit-box.on{display:block}
    .err{color:var(--kill-ink);font-size:13px}
    .ok{color:var(--teal);font-size:13px}
    .banner{background:var(--banner);color:var(--banner-ink);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  </style>
</head>
<body class="has-desk-nav">
  <header>
    <a href="index.html">Automate It Away</a>
    <nav class="desk-tabs" aria-label="Desk tabs">
      <a href="/desk" data-tab="queue">Queue</a>
      <a href="/drop" data-tab="drop">Drop</a>
      <a href="/rules" data-tab="rules">Rules</a>
      <a href="/connections" data-tab="pipes">Pipes</a>
      <a href="/more" data-tab="more">More</a>
    </nav>
  </header>
  <main class="wrap">
    <h1>Your desks</h1>
    <p class="muted">Saved on this phone. Explore. Owner can grant helper edit. Delete writes a log.</p>
    <div class="banner" id="banner">Shop name + desk code. Not other people’s shops.</div>
    <div id="list"></div>
    <div class="card">
      <h2>Add a desk</h2>
      <label>Shop name</label><input id="add-ws">
      <label>Desk code</label><input id="add-pin" inputmode="numeric">
      <div class="row"><button class="go" type="button" id="add-open">Add to this phone</button>
      <a class="edit" href="/onboard" style="display:inline-flex;align-items:center;text-decoration:none;padding:8px 12px;border-radius:9px">Create</a></div>
      <p class="err" id="add-err" hidden></p>
    </div>
    <div class="card">
      <h2>Deletion log</h2>
      <label>Shop name</label><input id="gone-ws">
      <div class="row"><button class="edit" type="button" id="gone-go">Look up</button></div>
      <div id="gone-out" class="meta"></div>
    </div>
  </main>
  <nav id="desk-nav" aria-label="Desk">
    <a href="/desk" data-tab="queue"><span>Queue</span></a>
    <a href="/drop" data-tab="drop"><span>Drop</span></a>
    <a href="/rules" data-tab="rules"><span>Rules</span></a>
    <a href="/connections" data-tab="pipes"><span>Pipes</span></a>
    <a href="/more" data-tab="more"><span>More</span></a>
  </nav>
  <script src="desk-switch.js"></script>
  <script src="desk-nav.js"></script>
  <script>
    function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return({"&":"&","<":"<",">":">","\"":""","'":"&#39;"})[c];});}
    function phone(){return (window.AIADesks&&AIADesks.list())||[];}
    function findP(slug){return phone().filter(function(d){return d.slug===slug;})[0]||{};}
    function banner(t){var e=document.getElementById("banner");if(e)e.textContent=t;}
    async function api(action,slug,extra){
      var row=findP(slug);
      var r=await fetch("/api/desks",{method:"POST",headers:{"Content-Type":"application/json","X-Workspace":slug||"","X-Pin":row.pin||""},body:JSON.stringify(Object.assign({action:action,slug:slug,pin:row.pin},extra||{}))});
      return {status:r.status,data:await r.json().catch(function(){return {};})};
    }
    async function hydrate(){
      var rows=phone();
      var box=document.getElementById("list");
      if(!rows.length){box.innerHTML="<div class='card'><p>No desks on this phone yet.</p></div>";return;}
      box.innerHTML=rows.map(function(d){
        return "<div class='card' data-slug='"+esc(d.slug)+"'><h2>"+esc(d.name||d.slug)+"</h2><p class='meta' data-meta>Checking…</p><div class='row'><button class='go' data-act='open'>Open queue</button><button class='edit' data-act='explore'>Explore</button><button class='edit' data-act='edit'>Edit</button><button class='edit' data-act='forget'>Forget phone</button></div><div class='edit-box' data-edit></div></div>";
      }).join("");
      var live=await api("list","",{desks:rows.map(function(d){return {slug:d.slug,pin:d.pin};})});
      (live.data.desks||[]).forEach(function(d){
        var card=document.querySelector("[data-slug='"+d.slug+"']");
        if(!card)return;
        var meta=card.querySelector("[data-meta]");
        if(!d.ok){if(meta)meta.textContent=d.error||"No match";return;}
        if(d.name&&window.AIADesks)AIADesks.patch(d.slug,{name:d.name,role:d.role||""});
        card.querySelector("h2").textContent=d.name||d.slug;
        if(meta)meta.textContent=(d.closed?"Closed":"Open")+" · "+(d.role||"")+" · waiting "+(d.waiting||0)+" · format "+(d.format||"aia.desk.v1");
        card.setAttribute("data-live",JSON.stringify(d));
      });
    }
    document.getElementById("list").onclick=async function(e){
      var btn=e.target.closest("[data-act]");if(!btn)return;
      var card=e.target.closest("[data-slug]");if(!card)return;
      var slug=card.getAttribute("data-slug");
      var act=btn.getAttribute("data-act");
      var box=card.querySelector("[data-edit]");
      var live={};try{live=JSON.parse(card.getAttribute("data-live")||"{}");}catch(ex){}
      var can=live.can||{};
      if(act==="open"){if(window.AIADesks)AIADesks.switchTo(slug);location.href="/desk";return;}
      if(act==="forget"){if(window.AIADesks)AIADesks.forget(slug);hydrate();return;}
      if(act==="explore"){
        var ex=await api("explore",slug);
        box.classList.add("on");
        box.innerHTML=ex.status>=400?(ex.data.error||"No"):"<p class='meta'>"+esc((ex.data.explore&&ex.data.explore.format)||"aia.desk.v1")+"</p>"+((ex.data.explore&&ex.data.explore.events)||[]).map(function(ev){return "<div class='meta'>"+esc((ev.t||"").slice(0,19))+" · "+esc(ev.action)+" · "+esc(ev.by)+"</div>";}).join("")+((ex.data.explore&&ex.data.explore.audit)||[]).slice(0,8).map(function(a){return "<div class='meta'>"+esc(a.action)+" · "+esc(a.result)+"</div>";}).join("");
        return;
      }
      if(act==="edit"){
        box.classList.toggle("on");
        box.innerHTML="<label>Shop name</label><input data-f='biz' value='"+esc(live.name||"")+"'>"+(can.edit||live.role==="owner"?"<label>Does</label><input data-f='does' value='"+esc(live.does||"")+"'>":"<p class='meta'>This seat cannot edit unless the owner grants it.</p>")+(live.role==="owner"?"<label><input type='checkbox' data-f='helperEdit'"+((live.perms&&live.perms.helperEdit)?" checked":"")+"> Helpers may edit</label><label><input type='checkbox' data-f='helperExport'"+((live.perms&&live.perms.helperExport)?" checked":"")+"> Helpers may export</label><label><input type='checkbox' data-f='helperExplore' checked> Helpers may explore</label><label><input type='checkbox' data-f='helperClose'"+((live.perms&&live.perms.helperClose)?" checked":"")+"> Helpers may close</label><label>Type shop name to delete</label><input data-f='confirm'>":"")+"<div class='row'>"+(can.edit||live.role==="owner"?"<button class='go' data-act='save'>Save</button>":"")+(live.role==="owner"?"<button class='edit' data-act='perms'>Save helper rights</button><button class='edit' data-act='export'>Export aia.desk.v1</button><button class='kill' data-act='delete'>Delete desk</button>":"")+"</div><p class='err' data-msg hidden></p>";
        return;
      }
      function val(k){var el=box.querySelector("[data-f='"+k+"']");if(!el)return"";return el.type==="checkbox"?el.checked:el.value;}
      var msg=box.querySelector("[data-msg]");
      if(act==="save"){var o=await api("update",slug,{biz:val("biz"),does:val("does")});if(msg){msg.hidden=false;msg.textContent=o.status>=400?(o.data.error||"No"):"Saved.";}hydrate();return;}
      if(act==="perms"){var p=await api("perms",slug,{helperEdit:!!val("helperEdit"),helperExport:!!val("helperExport"),helperExplore:!!val("helperExplore"),helperClose:!!val("helperClose")});if(msg){msg.hidden=false;msg.textContent=p.status>=400?(p.data.error||"No"):"Helper rights saved.";}return;}
      if(act==="export"){var pack=await api("export",slug);if(pack.status>=400)return;var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(pack.data.pack||{},null,2)],{type:"application/json"}));a.download=slug+"-desk.json";a.click();return;}
      if(act==="delete"){var d=await api("delete",slug,{confirm:val("confirm")});if(d.status>=400){if(msg){msg.hidden=false;msg.textContent=d.data.error||"Type the shop name.";}return;}if(window.AIADesks)AIADesks.forget(slug);banner((d.data.name||slug)+" deleted. Log kept.");hydrate();}
    };
    document.getElementById("add-open").onclick=async function(){
      var err=document.getElementById("add-err");err.hidden=true;
      var name=String(document.getElementById("add-ws").value||"").trim();
      var code=String(document.getElementById("add-pin").value||"").trim();
      if(!name||code.length<4){err.hidden=false;err.textContent="Shop name and a 4+ digit code.";return;}
      var slug=window.AIADesks?AIADesks.slugify(name):name;
      var r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json","X-Workspace":slug},body:JSON.stringify({action:"login",slug:slug,pin:code})});
      var data=await r.json().catch(function(){return {};});
      if(!r.ok){err.hidden=false;err.textContent=data.error||"No match.";return;}
      if(window.AIADesks)AIADesks.add({slug:(data.workspace&&data.workspace.slug)||slug,name:(data.workspace&&(data.workspace.biz||data.workspace.name))||name,pin:code,role:(data.you&&data.you.role)||""});
      hydrate();
    };
    document.getElementById("gone-go").onclick=async function(){
      var name=String(document.getElementById("gone-ws").value||"").trim();
      var out=document.getElementById("gone-out");
      var slug=window.AIADesks?AIADesks.slugify(name):name;
      var r=await api("gone",slug);
      var events=r.data.events||[];
      out.innerHTML=events.length?events.map(function(e){return esc((e.t||"").slice(0,19))+" · "+esc(e.action)+" · "+esc(e.by||"")+(e.extra&&e.extra.jobs!=null?" · cards "+e.extra.jobs:"");}).join("<br>"):(r.data.error||"No log.");
    };
    hydrate();
  </script>
</body>
</html>
