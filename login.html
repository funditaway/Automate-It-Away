<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0d6b6b">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open this queue · Automate It Away</title>
  <style>
    :root { --teal:#0d6b6b; --orange:#f39c12; --ink:#1a2332; --muted:#6b7c8f; --line:#d1dae3; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Segoe UI",system-ui,sans-serif;background:linear-gradient(160deg,#f2fbfb,#fff 50%);color:var(--ink);min-height:100vh}
    a{color:var(--teal);text-decoration:none}
    header{padding:14px 5vw;display:flex;justify-content:space-between}
    .card{width:min(440px,94vw);margin:24px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
    h1{color:#0a4f4f;font-size:1.4rem;margin-bottom:6px}
    p{color:var(--muted);margin-bottom:16px}
    label{display:block;font-size:12px;font-weight:700;color:#0a4f4f;margin:12px 0 6px}
    .tip{display:inline-block;width:16px;height:16px;border-radius:50%;background:#e6f7f7;color:#0a4f4f;font-size:11px;line-height:16px;text-align:center;cursor:help;margin-left:4px;vertical-align:middle}
    input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}
    button{width:100%;margin-top:16px;border:0;border-radius:12px;padding:12px;background:var(--orange);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
    .err{display:none;margin-top:10px;color:#c0392b;font-size:14px}
  </style>
</head>
<body>
  <header>
    <a href="index.html"><strong>Automate It Away</strong></a>
    <a href="onboard.html">New desk</a>
  </header>
  <form class="card" id="form">
    <h1>Open this queue</h1>
    <p>Desk name + your desk code. Owner and helper land on the same desk.</p>
    <label>Desk name <span class="tip" title="The name you used when you opened the desk.">?</span></label>
    <input name="slug" required placeholder="Desk name" autocomplete="username">
    <label>Your desk code <span class="tip" title="Owner and helper each have their own code.">?</span></label>
    <input name="pin" required inputmode="numeric" minlength="4" placeholder="Your code" autocomplete="current-password">
    <button type="submit">That's my queue</button>
    <p class="err" id="err"></p>
  </form>
  <script src="analytics.js"></script>
  <script src="desk-switch.js"></script>
  <script>
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const slug = AIADesks.slugify(f.get("slug"));
      const pin = f.get("pin");
      const err = document.getElementById("err");
      try {
        const r = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Workspace": slug },
          body: JSON.stringify({ action: "login", slug, pin })
        });
        const data = await r.json();
        if (!r.ok) { err.textContent = data.error || "Desk name or code does not match."; err.style.display = "block"; return; }
        const desk = (data && data.workspace) || {};
        AIADesks.open({
          slug: desk.slug || slug,
          name: desk.biz || desk.name || desk.slug || slug,
          pin: pin,
          role: (data.you && data.you.role) || ""
        });
        if (data.you && data.you.name) localStorage.setItem("aia_name", data.you.name);
        if (desk.model) localStorage.setItem("aia_model", desk.model);
        location.href = "desk.html";
      } catch (ex) {
        err.textContent = "Could not reach the desk.";
        err.style.display = "block";
      }
    };
  </script>
</body>
</html>
