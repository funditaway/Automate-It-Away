<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0d6b6b">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Open this desk · Automate It Away</title>
  <script>
  (function(){var t=localStorage.getItem('aia_theme')||'system';var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);document.documentElement.classList.toggle('light',!d);})();
  </script>
  <link rel="stylesheet" href="theme.css">
</head>
<body class="page-bg">
  <header class="site-header">
    <a class="brand" href="index.html"><img class="brand-mark" src="img/aia-pyramid-tile.svg" width="28" height="28" alt=""><span class="brand-name">Automate It Away</span></a>
    <div class="nav">
      <a href="onboard.html">New desk</a>
      <button class="theme-btn" data-theme-btn type="button" onclick="AIATheme.cycle()">Auto</button>
    </div>
  </header>
  <form class="gate-card" id="form">
    <h1>Open this desk</h1>
    <p class="sub">Desk name + your desk code. Owner or member. Same queue. Members work at the permission the owner set. Email is not the login.</p>
    <div class="talk-bar" id="talkBar" hidden>
      <p class="talk-status" id="talkStatus">Say the desk name. Code stays typed — not read back.</p>
      <button type="button" id="hearBtn">Hear this</button>
      <button type="button" id="talkBtn">Talk</button>
      <button type="button" id="quietBtn">Quiet</button>
    </div>
    <label>Desk name <span class="tip" title="The name you used when you opened the desk. Letters and dashes.">?</span></label>
    <input name="slug" required placeholder="Desk name" autocomplete="username">
    <label>Your desk code <span class="tip" title="Owner and staff each have their own code. Do not share the owner code.">?</span></label>
    <input name="pin" required inputmode="numeric" minlength="4" placeholder="Your code" autocomplete="current-password">
    <button class="btn" type="submit">Open</button>
    <p class="err" id="err"></p>
  </form>
  <script src="theme.js"></script>
  <script src="desk-switch.js"></script>
  <script src="speech.js"></script>
  <script>
    const form = document.getElementById("form");
    const talkBar = document.getElementById("talkBar");
    const talkStatus = document.getElementById("talkStatus");
    const talkBtn = document.getElementById("talkBtn");
    if (window.AIASpeech && (AIASpeech.canSpeak() || AIASpeech.canListen())) {
      talkBar.hidden = false;
    }
    document.getElementById("hearBtn").onclick = function () {
      AIASpeech.speak("Say the desk name. Then type your desk code.");
    };
    talkBtn.onclick = function () {
      talkBtn.classList.add("on");
      talkStatus.textContent = "Listening for the desk name…";
      form.elements.slug.classList.add("on-talk");
      AIASpeech.listen(function (heard) {
        talkBtn.classList.remove("on");
        form.elements.slug.value = heard.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        talkStatus.textContent = "Heard " + form.elements.slug.value + ". Type your code.";
        form.elements.pin.focus();
      }, function (msg) {
        talkBtn.classList.remove("on");
        talkStatus.textContent = msg;
      });
    };
    document.getElementById("quietBtn").onclick = function () {
      AIASpeech.stopTalk();
      talkBtn.classList.remove("on");
      talkStatus.textContent = "Quiet. Type the desk name and code.";
    };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const slug = String(f.get("slug") || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      const pin = f.get("pin");
      const err = document.getElementById("err");
      try {
        const r = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Workspace": slug },
          body: JSON.stringify({ action: "login", slug, pin })
        });
        const data = await r.json();
        if (!r.ok) { err.textContent = data.error || "Desk name or code does not match."; err.style.display = "block"; return; }
        localStorage.setItem("aia_ws", data.workspace.slug);
        localStorage.setItem("aia_pin", pin);
        if (data.you && data.you.role) localStorage.setItem("aia_role", data.you.role);
        if (data.you && data.you.name) localStorage.setItem("aia_name", data.you.name);
        if (data.workspace && data.workspace.biz) localStorage.setItem("aia_desk_name", data.workspace.biz);
        if (window.AIADesks) {
          AIADesks.open({
            slug: data.workspace.slug,
            name: (data.workspace && (data.workspace.biz || data.workspace.name)) || data.workspace.slug,
            pin: pin,
            role: (data.you && data.you.role) || "owner",
            who: (data.you && data.you.name) || ""
          });
        }
        location.href = "desk.html";
      } catch (ex) {
        err.textContent = "Could not reach the desk.";
        err.style.display = "block";
      }
    };
  </script>
</body>
</html>
