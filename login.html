<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0d6b6b">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Open this shop · Automate It Away</title>
  <script>
  (function(){var t=localStorage.getItem('aia_theme')||'system';var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);document.documentElement.classList.toggle('light',!d);})();
  </script>
  <link rel="stylesheet" href="theme.css">
</head>
<body class="page-bg">
  <header class="site-header">
    <a href="index.html">Automate It Away</a>
    <div class="nav">
      <a href="onboard.html">New shop</a>
      <button class="theme-btn" data-theme-btn type="button" onclick="AIATheme.cycle()">Auto</button>
    </div>
  </header>
  <form class="gate-card" id="form">
    <h1>Open this queue</h1>
    <p class="sub">Shop name + your desk code. Owner and helper land on the same desk.</p>
    <label>Shop name <span class="tip" title="The name you used when you opened the shop. Letters and dashes.">?</span></label>
    <input name="slug" required placeholder="rivera-resale" autocomplete="username">
    <label>Your desk code <span class="tip" title="Owner and staff each have their own code. Do not share the owner code.">?</span></label>
    <input name="pin" required inputmode="numeric" minlength="4" placeholder="Your code" autocomplete="current-password">
    <button class="btn" type="submit">Open</button>
    <p class="err" id="err"></p>
  </form>
  <script src="theme.js"></script>
  <script>
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const slug = String(f.get("slug") || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      const pin = f.get("pin");
      const err = document.getElementById("err");
      try {
        const r = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Workspace": slug },
          body: JSON.stringify({ action: "login", slug, pin })
        });
        const data = await r.json();
        if (!r.ok) { err.textContent = data.error || "Shop name or code does not match."; err.style.display = "block"; return; }
        localStorage.setItem("aia_ws", data.workspace.slug);
        localStorage.setItem("aia_pin", pin);
        if (data.you && data.you.role) localStorage.setItem("aia_role", data.you.role);
        if (data.you && data.you.name) localStorage.setItem("aia_name", data.you.name);
        if (data.workspace && data.workspace.biz) localStorage.setItem("aia_desk_name", data.workspace.biz);
        location.href = "desk.html";
      } catch (ex) {
        err.textContent = "Could not reach the desk.";
        err.style.display = "block";
      }
    };
  </script>
</body>
</html>
