<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0d6b6b">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pro account · Automate It Away</title>
  <script>(function(){var t=localStorage.getItem('aia_theme')||'system';var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);})();</script>
  <link rel="stylesheet" href="theme.css">
  <style>
    .wrap{width:min(760px,94vw);margin:0 auto;padding:18px 0 80px}
    .banner{background:var(--banner);color:var(--banner-ink);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
    .meta,.muted{font-size:13px;color:var(--muted)}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    button,.go,.edit{border:0;border-radius:9px;padding:10px 12px;font-weight:700;min-height:44px;font-family:inherit}
    .go{background:#f39c12;color:#fff}
    .edit{background:var(--card);border:1px solid var(--line)}
    input{min-height:44px;border-radius:10px;border:1px solid var(--line);padding:8px 10px;width:100%;box-sizing:border-box}
    .item{border-top:1px solid var(--line);padding:8px 0}
    .err{color:#b42318;display:none}
  </style>
</head>
<body class="page-bg">
  <header class="site-header">
    <a class="brand" href="index.html"><img class="brand-mark" src="img/aia-pyramid-tile.svg" width="28" height="28" alt=""><span class="brand-name">Automate It Away</span></a>
    <div class="nav"><a href="admin.html">People</a><button class="theme-btn" data-theme-btn type="button" onclick="AIATheme.cycle()">Auto</button></div>
  </header>
  <main class="wrap">
    <h1>Your AIA account</h1>
    <p class="muted">Own a desk or sit on one. Both show here. Free on Desk, Pro, and Crew.</p>
    <div class="banner" id="plan">AIA plan · free</div>
    <form class="card" id="gate">
      <h2>Saved login</h2>
      <p class="meta">Desk name + your code. Owner or member. Email is not the login.</p>
      <label>Account or desk name</label>
      <input id="slug" required>
      <label>Your code</label>
      <input id="pin" required inputmode="numeric" minlength="4">
      <p><button class="go" type="submit">Open the account</button></p>
      <p class="err" id="err"></p>
    </form>
    <div id="home" hidden>
      <div class="card"><h2>AIA subscription</h2><div class="row" id="plans"></div></div>
      <div class="card" id="owned"></div>
      <div class="card" id="member"></div>
    </div>
  </main>
  <script src="theme.js"></script>
  <script>
    const slugEl=document.getElementById("slug"); const pinEl=document.getElementById("pin"); const err=document.getElementById("err");
    slugEl.value=localStorage.getItem("aia_desk_name")||localStorage.getItem("aia_ws")||"";
    pinEl.value=localStorage.getItem("aia_pin")||"";
    function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return({"&":"&","<":"<",">":">","\"":"""})[c];});}
    function paint(d){
      document.getElementById("gate").hidden=true; document.getElementById("home").hidden=false;
      const plan=d.plan||{}; document.getElementById("plan").textContent="AIA plan · "+(plan.name||plan.plan||"Desk")+" · active · free";
      const catalog=d.plans||plan.catalog||[];
      document.getElementById("plans").innerHTML=catalog.map(function(p){const on=p.id===(plan.plan||d.active); return "<button type=\"button\" class=\""+(on?"go":"edit")+"\" data-plan=\""+esc(p.id)+"\">"+esc(p.name)+(on?" · active":"")+"</button>";}).join("");
      Array.prototype.forEach.call(document.querySelectorAll("#plans [data-plan]"),function(btn){btn.onclick=function(){act("plan",{plan:btn.getAttribute("data-plan")});};});
      const owned=d.desksOwned||(d.mine&&d.mine.owned)||[];
      document.getElementById("owned").innerHTML="<h2>Desks you own</h2>"+(owned.length?owned.map(function(w){return "<div class=\"item\"><strong>"+esc(w.name)+"</strong><div class=\"meta\">Owner</div></div>";}).join(""):"<p class=\"meta\">Open a desk as owner.</p>");
      const sitting=d.desksMember||(d.mine&&d.mine.member)||[];
      document.getElementById("member").innerHTML="<h2>Desks you sit on</h2>"+(sitting.length?sitting.map(function(w){return "<div class=\"item\"><strong>"+esc(w.name)+"</strong><div class=\"meta\">"+esc(w.kind)+(w.requestedKind?" · asked "+esc(w.requestedKind):"")+"</div><button type=\"button\" class=\"edit\" data-ask=\""+esc(w.slug)+"\" data-kind=\"staff\">Ask for staff</button></div>";}).join(""):"<p class=\"meta\">Join a desk as a member. Your account stays yours.</p>");
      Array.prototype.forEach.call(document.querySelectorAll("[data-ask]"),function(btn){btn.onclick=function(){act("ask",{kind:btn.getAttribute("data-kind")},btn.getAttribute("data-ask"));};});
    }
    async function act(action, extra, desk){
      const slug=String((desk||slugEl.value)||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
      const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json","X-Workspace":slug,"X-Pin":pinEl.value},body:JSON.stringify(Object.assign({action:action,slug:slug,pin:pinEl.value},extra||{}))});
      const d=await r.json().catch(function(){return {};});
      if(!r.ok){err.style.display="block";err.textContent=d.error||"Could not save.";return;}
      if(action==="ask"){err.style.display="block";err.textContent=d.hint||"On the owner queue.";return;}
      paint(d);
    }
    document.getElementById("gate").onsubmit=async function(e){e.preventDefault();err.style.display="none";await act("login");};
  </script>
</body>
</html>
