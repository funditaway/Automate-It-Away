<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0d6b6b">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Marketplace · Automate It Away</title>
  <meta name="description" content="Shop AIA packs. See what’s in a listing. Use a free pack on your desk. A priced pack is a tag — no card. Packs copy rules. They do not send money.">
  <script>
  (function(){var t=localStorage.getItem('aia_theme')||'system';var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);document.documentElement.classList.toggle('light',!d);})();
  </script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="desk-nav.css">
  <style>
    body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;margin:0}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(760px,94vw);margin:0 auto;padding:18px 0 40px}
    h1{color:var(--heading);font-size:1.35rem;margin:0}
    h2{color:var(--heading);font-size:1.02rem;margin:18px 0 8px}
    .sub{color:var(--muted);margin:4px 0 14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
    label{display:block;font-size:12px;font-weight:700;color:var(--heading);margin:0 0 4px}
    input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--card);color:var(--ink);box-sizing:border-box}
    .go,.use{min-height:44px;border:0;border-radius:10px;padding:10px 12px;background:var(--orange);color:#fff;font-weight:700;cursor:pointer}
    .ghost{background:transparent;color:var(--heading);border:1px solid var(--line)}
    .hint,.err{font-size:13px;color:var(--muted);margin-top:8px}
    .err{color:var(--kill-ink);display:none}
    .ok{color:#1b7a3d;display:none;margin-top:8px}
    .pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
    .pills button,.feat{min-height:40px;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--card);color:var(--heading);font:700 13px system-ui;cursor:pointer}
    .pills button.on{background:var(--orange);color:#fff;border-color:transparent}
    .feat{cursor:default;min-height:32px;font-weight:600;font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
    .shop{display:flex;flex-direction:column;gap:6px;min-height:100%}
    .shop b{color:var(--heading);font-size:1.02rem}
    .tag{font-size:12px;color:var(--muted)}
    .cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .cta a,.cta button{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
    .how{display:grid;gap:8px}
    .how div{background:var(--bg-soft,rgba(13,107,107,.08));border-radius:10px;padding:10px 12px}
    .how b{display:block;color:var(--heading);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
    .strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
    .strip div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
    .strip b{display:block;color:var(--heading);font-size:12px}
    .strip span{font-size:12px;color:var(--muted)}
    .banner{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
    .demo .top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
    .draft{background:var(--bg-soft,rgba(13,107,107,.08));border-radius:8px;padding:8px;font-size:13px;margin:8px 0}
    .taps{font-size:12px;color:var(--orange);font-weight:700}
    .back{display:inline-block;margin:0 0 10px;font-weight:700;color:var(--teal);min-height:44px;line-height:44px}
    .inc li{margin:0 0 6px;color:var(--ink)}
    .profile b{display:block}
    @media(max-width:640px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:420px){
      .grid{grid-template-columns:1fr}
      .cta a,.cta button{width:100%}
    }
  </style>
</head>
<body class="page-bg has-desk-nav">
  <header class="site-header">
    <a class="brand" href="index.html"><img class="brand-mark" src="img/aia-pyramid-tile.svg" width="28" height="28" alt=""><span class="brand-name">Automate It Away</span></a>
    <span class="brand-page">Marketplace</span>
    <div class="nav">
      <a href="/create">Create</a>
      <a href="/examples">Examples</a>
      <button class="theme-btn" data-theme-btn type="button" onclick="AIATheme.cycle()">Auto</button>
    </div>
    <nav class="desk-tabs" aria-label="Desk tabs">
      <a href="/desk" data-tab="queue">Queue</a>
      <a href="/drop" data-tab="drop">Drop</a>
      <a href="/rules" data-tab="rules">Rules</a>
      <a href="/pipes" data-tab="pipes">Pipes</a>
      <a href="/more" data-tab="more">More</a>
    </nav>
  </header>
  <main class="wrap" id="main">
    <p class="err" id="err"></p>
    <p class="ok" id="ok"></p>
    <div id="view"></div>
  </main>
  <nav id="desk-nav" aria-label="Desk">
    <a href="/desk" data-tab="queue"><span>Queue</span></a>
    <a href="/drop" data-tab="drop"><span>Drop</span></a>
    <a href="/rules" data-tab="rules"><span>Rules</span></a>
    <a href="/pipes" data-tab="pipes"><span>Pipes</span></a>
    <a href="/more" data-tab="more"><span>More</span></a>
  </nav>
  <script src="theme.js"></script>
  <script src="desk-switch.js"></script>
  <script src="desk-nav.js"></script>
  <script src="market-shop.js"></script>
</body>
</html>
