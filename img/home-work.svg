<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Shop, front desk, and office cards on one desk">
  <rect width="960" height="640" fill="#e7f3f3"/>
  <rect x="28" y="36" width="292" height="568" rx="22" fill="#0d6b6b"/>
  <rect x="48" y="56" width="252" height="528" rx="16" fill="#fff"/>
  <text x="68" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#0a4f4f" font-weight="700">Service shop</text>
  <text x="68" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#6b7c8f">Missed call + photo</text>
  <rect x="68" y="148" width="212" height="88" rx="12" fill="#eef7f7"/>
  <text x="84" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#0a4f4f" font-weight="700">Furnace not lighting</text>
  <text x="84" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#6b7c8f">Estimate drafted</text>
  <rect x="68" y="256" width="70" height="28" rx="8" fill="#f39c12"/>
  <text x="80" y="275" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#fff" font-weight="700">Text it</text>
  <rect x="146" y="256" width="78" height="28" rx="8" fill="#119494"/>
  <text x="156" y="275" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#fff" font-weight="700">Email it</text>
  <rect x="334" y="36" width="292" height="568" rx="22" fill="#0d6b6b"/>
  <rect x="354" y="56" width="252" height="528" rx="16" fill="#fff"/>
  <text x="374" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#0a4f4f" font-weight="700">Front desk</text>
  <text x="374" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#6b7c8f">Recall is due</text>
  <rect x="374" y="148" width="212" height="120" rx="12" fill="#eef7f7"/>
  <text x="390" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#0a4f4f" font-weight="700">Confirm visit</text>
  <text x="390" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#6b7c8f">Chair open Thursday 10:00.</text>
  <rect x="374" y="288" width="70" height="28" rx="8" fill="#f39c12"/>
  <text x="386" y="307" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#fff" font-weight="700">Text it</text>
  <rect x="452" y="288" width="78" height="28" rx="8" fill="#fff" stroke="#d1dae3"/>
  <text x="462" y="307" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0d6b6b" font-weight="700">Hand to</text>
  <rect x="640" y="36" width="292" height="568" rx="22" fill="#0d6b6b"/>
  <rect x="660" y="56" width="252" height="528" rx="16" fill="#fff"/>
  <text x="680" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#0a4f4f" font-weight="700">Office</text>
  <text x="680" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#6b7c8f">Lead + file</text>
  <rect x="680" y="148" width="212" height="120" rx="12" fill="#eef7f7"/>
  <text x="696" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#0a4f4f" font-weight="700">Renewal packet</text>
  <text x="696" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#6b7c8f">Draft sits until you send it.</text>
  <rect x="680" y="288" width="86" height="28" rx="8" fill="#119494"/>
  <text x="692" y="307" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#fff" font-weight="700">Email it</text>
  <rect x="776" y="288" width="72" height="28" rx="8" fill="none" stroke="#c97878"/>
  <text x="792" y="307" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#c97878" font-weight="700">Stop</text>
</svg>
