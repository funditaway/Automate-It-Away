<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open your shop · Automate It Away</title>
  <style>
    :root { --teal-900:#0a4f4f;--teal-800:#0d6b6b;--orange-500:#f39c12;--gray-900:#1a2332;--gray-500:#6b7c8f;--gray-300:#d1dae3;--teal-50:#f2fbfb; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Segoe UI",system-ui,sans-serif;background:linear-gradient(160deg,var(--teal-50),#fff 45%,#fff8f0);color:var(--gray-900);min-height:100vh}
    a{color:var(--teal-800);text-decoration:none}
    header{padding:14px 5vw;display:flex;justify-content:space-between;align-items:center}
    .card{width:min(520px,94vw);margin:12px auto 40px;background:#fff;border:1px solid var(--gray-300);border-radius:18px;padding:22px;box-shadow:0 12px 40px rgba(10,79,79,.12)}
    h1{font-size:1.45rem;color:var(--teal-900);margin-bottom:6px}
    p.sub{color:var(--gray-500);margin-bottom:18px;font-size:.95rem}
    label{display:block;font-size:12px;font-weight:700;color:var(--teal-900);margin:12px 0 6px}
    .tip{display:inline-block;width:16px;height:16px;border-radius:50%;background:#e6f7f7;color:#0a4f4f;font-size:11px;line-height:16px;text-align:center;cursor:help;margin-left:4px;vertical-align:middle}
    input,select{width:100%;padding:11px 12px;border:1px solid var(--gray-300);border-radius:10px;font:inherit}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{width:100%;margin-top:16px;border:0;border-radius:12px;padding:12px;background:var(--orange-500);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
    .hint{margin-top:12px;font-size:13px;color:var(--gray-500);text-align:center}
    .err{display:none;margin-top:10px;color:#c0392b;font-size:14px}
    @media(max-width:560px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <a href="index.html"><strong>Automate It Away</strong></a>
    <a href="login.html">Already have a shop</a>
  </header>
  <form class="card" id="form">
    <h1>Open your shop</h1>
    <p class="sub">One queue for this business. You tap only what needs a person.</p>
    <label>Your name</label>
    <input name="name" required placeholder="Alex Rivera" autocomplete="name">
    <div class="row">
      <div>
        <label>Shop name <span class="tip" title="This becomes the login. Letters and dashes only.">?</span></label>
        <input name="biz" required placeholder="Rivera Resale">
      </div>
      <div>
        <label>City</label>
        <input name="city" required placeholder="Springfield">
      </div>
    </div>
    <label>You are</label>
    <select name="role" required>
      <option value="owner">Owner</option>
      <option value="employee">Staff</option>
    </select>
    <label>What this shop does</label>
    <select name="model" required>
      <option>Consignment & resale</option>
      <option>Something else</option>
    </select>
    <label>Email <span class="tip" title="For you. Login is shop name + desk code, not email.">?</span></label>
    <input type="email" name="email" required placeholder="you@shop.com">
    <label>Desk code <span class="tip" title="4 or more digits. Same code on any phone opens this shop. Staff get their own later.">?</span></label>
    <input name="pin" required inputmode="numeric" minlength="4" placeholder="Your code" autocomplete="new-password">
    <button class="btn" type="submit">Open my shop</button>
    <p class="hint">Shop name + your code opens this queue on any phone.</p>
    <p class="err" id="err"></p>
  </form>
  <script>
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const pin = String(f.get("pin") || "");
      const err = document.getElementById("err");
      if (pin.length < 4) { err.textContent = "Pick a desk code with at least 4 digits."; err.style.display = "block"; return; }
      const slug = String(f.get("biz") || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
      localStorage.setItem("aia_ws", slug);
      localStorage.setItem("aia_pin", pin);
      localStorage.setItem("aia_role", f.get("role") || "owner");
      localStorage.setItem("aia_name", f.get("name") || "");
      try {
        const r = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Workspace": slug, "X-Pin": pin },
          body: JSON.stringify({
            action: "open",
            name: f.get("name"),
            biz: f.get("biz"),
            city: f.get("city"),
            model: f.get("model"),
            email: f.get("email"),
            pin
          })
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) { err.textContent = data.error || "Could not open the shop."; err.style.display = "block"; return; }
        location.href = (f.get("role") === "employee") ? "desk.html" : "admin.html";
      } catch (ex) {
        err.textContent = "Could not reach the desk.";
        err.style.display = "block";
      }
    };
  </script>
</body>
</html>
