<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create · Automate It Away</title>
<style>body{font-family:system-ui;margin:0;background:#f4f7fa}header{background:#0d6b6b;color:#fff;padding:12px 4vw;display:flex;justify-content:space-between}a{color:inherit}.wrap{width:min(640px,92vw);margin:0 auto;padding:18px 0}label{display:block;margin:10px 0 4px;font-weight:700;color:#0a4f4f}input,textarea,select{width:100%;padding:10px;border:1px solid #d1dae3;border-radius:8px}button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:#f39c12;color:#fff;font-weight:700}</style>
</head>
<body>
<header><a href="index.html">Create</a><a href="dashboard.html">Desk</a></header>
<main class="wrap">
<h1>Make a job</h1>
<form id="form">
<label>Title</label><input name="title" required placeholder="List the oak dresser">
<label>Why it needs a human</label><textarea name="why" rows="3"></textarea>
<button type="submit">Create</button>
</form>
<p id="ok"></p>
</main>
<script src="store.js"></script>
<script>
document.getElementById("form").onsubmit=e=>{
 e.preventDefault();
 const f=new FormData(e.target);
 const job={id:Date.now(),model:"Consignment",title:f.get("title"),why:f.get("why")||"You created this.",agent:"Owner",step:"Do the work",log:["Created by user"]};
 const jobs=JSON.parse(localStorage.getItem("aia_jobs")||"[]");jobs.unshift(job);localStorage.setItem("aia_jobs",JSON.stringify(jobs));
 if(window.AIA)AIA.log("Owner","Created job · "+job.title,"Waiting");
 document.getElementById("ok").innerHTML='In the queue. <a href="dashboard.html">Open the desk</a>';
};
</script>
</body></html>
