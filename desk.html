<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk · Automate It Away</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0d6b6b">
  <script>
  (function(){var t=localStorage.getItem('aia_theme')||'system';var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);})();
  </script>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    a{color:inherit;text-decoration:none}
    header{background:linear-gradient(135deg,#0f7f7f,#0d6b6b);color:#fff;padding:12px 4vw;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .wrap{width:min(880px,94vw);margin:0 auto;padding:16px 0 48px}
    .banner{background:var(--banner);color:var(--banner-ink);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
    .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
    .item h3{font-size:1rem;color:var(--heading)}
    .item p{color:var(--muted);font-size:13px;margin:4px 0 8px}
    .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    button{border:0;border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer;font-family:inherit}
    .go{background:#119494;color:#fff}
    .kill{background:var(--kill-bg);color:var(--kill-ink)}
    .edit{background:var(--edit);color:var(--edit-ink)}
    .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
    .kpi span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}
    .kpi b{font-size:1.3rem;color:var(--teal)}
    .tip{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--edit);color:var(--edit-ink);font-size:11px;line-height:16px;text-align:center;cursor:help;margin-left:4px}
    input{padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
    .sheet{position:fixed;inset:0;background:rgba(10,79,79,.45);display:none;align-items:flex-end;justify-content:center}
    .sheet.on{display:flex}
    .sheet-card{background:var(--card);color:var(--ink);width:min(480px,100%);border-radius:16px 16px 0 0;padding:16px}
    img.thumb{max-width:120px;border-radius:8px;display:block;margin:6px 0}
    @media(max-width:640px){.kpis{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <a href="index.html"><strong>Automate It Away</strong></a>
    <span>
      <a href="admin.html">People</a> ·
      <a href="consign.html" id="nav-consign" hidden>Consign</a>
      <a href="widget.html">Drop box</a> ·
      <a href="help.html">Help</a> ·
      <button class="theme-btn" data-theme-btn type="button" onclick="AIATheme.cycle()">Auto</button>
    </span>
  </header>
  <main class="wrap">
    <div class="banner" id="banner">Opening your queue…</div>
    <div class="kpis">
      <div class="kpi"><span>Needs you <span class="tip" title="The engine stopped. You Send or Stop.">?</span></span><b id="k-wait">—</b></div>
      <div class="kpi"><span>Over $250 <span class="tip" title="Waiting on the owner.">?</span></span><b id="k-held">—</b></div>
      <div class="kpi"><span>Sent</span><b id="k-ship">—</b></div>
    </div>
    <div class="row" style="margin-bottom:8px">
      <input id="ws" placeholder="Shop name">
      <input id="pin" placeholder="Desk code" inputmode="numeric" style="width:110px">
      <button class="edit" type="button" onclick="load()">Refresh</button>
      <button class="go" type="button" onclick="capture()">Add a test item</button>
    </div>
    <div id="queue"></div>
  </main>
  <div class="sheet" id="sheet" onclick="if(event.target===this) this.classList.remove('on')">
    <div class="sheet-card" id="sheet-card"></div>
  </div>
  <script>
    const wsEl = document.getElementById("ws");
    const pinEl = document.getElementById("pin");
    const role = localStorage.getItem("aia_role") || "";
    function headers() {
      const h = { "Content-Type": "application/json", "X-Workspace": wsEl.value || localStorage.getItem("aia_ws") || "demo" };
      const pin = pinEl.value || localStorage.getItem("aia_pin");
      if (pin) h["X-Pin"] = pin;
      return h;
    }
    async function api(path, opts) {
      const r = await fetch(path, Object.assign({ headers: headers() }, opts || {}));
      const data = await r.json().catch(() => ({}));
      return { status: r.status, data };
    }
    function showConsignNav(model) {
      const el = document.getElementById("nav-consign");
      if (!el) return;
      const blob = String(model || localStorage.getItem("aia_model") || "") + " " + (wsEl.value || "");
      el.hidden = !/consign|resale/i.test(blob);
      if (!el.hidden) el.insertAdjacentText("afterend", " · ");
    }
    let JOBS = [];
    function labelStatus(s) {
      if (s === "exception") return "Needs you";
      if (s === "held") return "Over $250";
      if (s === "shipped") return "Sent";
      if (s === "killed") return "Stopped";
      return s || "";
    }
    async function load() {
      if (wsEl.value) localStorage.setItem("aia_ws", wsEl.value);
      if (pinEl.value) localStorage.setItem("aia_pin", pinEl.value);
      const banner = document.getElementById("banner");
      try {
        await api("/api/health");
        banner.textContent = "You only tap what needs a person.";
        const jobs = await api("/api/jobs");
        JOBS = jobs.data.jobs || [];
        const auth = await api("/api/auth");
        if (auth.data && auth.data.workspace && auth.data.workspace.model) {
          localStorage.setItem("aia_model", auth.data.workspace.model);
          showConsignNav(auth.data.workspace.model);
        } else showConsignNav();
      } catch (e) {
        banner.textContent = "Could not reach the desk.";
        JOBS = [];
        showConsignNav();
      }
      document.getElementById("k-wait").textContent = JOBS.filter(j => j.status === "exception").length;
      document.getElementById("k-held").textContent = JOBS.filter(j => j.status === "held").length;
      document.getElementById("k-ship").textContent = JOBS.filter(j => j.status === "shipped").length;
      const staff = role === "employee";
      document.getElementById("queue").innerHTML = JOBS.filter(j => j.status === "exception" || j.status === "held").map(j => `
        <article class="item">
          <div style="font-size:11px;color:inherit;opacity:.7">${labelStatus(j.status)}</div>
          <h3>${j.title}</h3>
          ${j.photoUrl ? `<img class="thumb" src="${j.photoUrl}" alt="">` : ""}
          <p>${j.why || ""}</p>
          <div class="row">
            <button class="go" onclick="ship('${j.id}', ${Number(j.amount||0)})">Send ${j.amount?("$"+j.amount):""}</button>
            ${staff ? "" : `<button class="kill" onclick="kill('${j.id}', '${String(j.title).replace(/'/g,"")}')">Stop</button>`}
          </div>
        </article>`).join("") || `<p style="color:var(--muted)">Nothing needs you.</p>`;
    }
    async function capture() {
      await api("/api/jobs", { method: "POST", body: JSON.stringify({ action: "capture", title: "Test item from the desk" }) });
      load();
    }
    async function ship(id, amount) {
      const out = await api("/api/jobs", { method: "POST", body: JSON.stringify({ action: "ship", id, amount, confirm: false }) });
      if (out.status === 409) {
        document.getElementById("sheet-card").innerHTML = `
          <h3>Over $250</h3>
          <p style="color:var(--muted);margin:8px 0">Only the owner can release $${amount || 0}.</p>
          <div class="row">
            ${role === "employee" ? "" : `<button class="go" onclick="confirmShip('${id}', ${amount})">Release</button>`}
            <button class="edit" onclick="document.getElementById('sheet').classList.remove('on')">Keep waiting</button>
          </div>`;
        document.getElementById("sheet").classList.add("on");
        load();
        return;
      }
      load();
    }
    async function confirmShip(id, amount) {
      await api("/api/jobs", { method: "POST", body: JSON.stringify({ action: "ship", id, amount, confirm: true }) });
      document.getElementById("sheet").classList.remove("on");
      load();
    }
    async function kill(id, title) {
      document.getElementById("sheet-card").innerHTML = `
        <h3>Stop this?</h3>
        <p style="color:var(--muted);margin:8px 0">${title}. Nothing goes out.</p>
        <div class="row">
          <button class="kill" onclick="confirmKill('${id}')">Yes, stop it</button>
          <button class="edit" onclick="document.getElementById('sheet').classList.remove('on')">Keep it</button>
        </div>`;
      document.getElementById("sheet").classList.add("on");
    }
    async function confirmKill(id) {
      await api("/api/jobs", { method: "POST", body: JSON.stringify({ action: "kill", id, confirm: true }) });
      document.getElementById("sheet").classList.remove("on");
      load();
    }
    if (localStorage.getItem("aia_ws")) wsEl.value = localStorage.getItem("aia_ws");
    if (localStorage.getItem("aia_pin")) pinEl.value = localStorage.getItem("aia_pin");
    showConsignNav();
    load();
  </script>
</body>
</html>
