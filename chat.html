<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Talk to the desk · Automate It Away</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="canonical" href="/drop?mode=talk#talk">
  <script>
  (function () {
    var t = localStorage.getItem("aia_theme") || "system";
    var d = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.classList.toggle("dark", d);
    var q = location.search || "";
    if (!/[?&]mode=/.test(q)) q = q ? (q + "&mode=talk") : "?mode=talk";
    location.replace("/drop" + q + "#talk");
  })();
  </script>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="index.html"><img class="brand-mark" src="img/aia-pyramid-tile.svg" width="28" height="28" alt=""><span class="brand-name">Automate It Away</span></a>
  </header>
  <p><a href="/drop?mode=talk#talk">Talk to the desk lives on Drop.</a></p>
</body>
</html>
