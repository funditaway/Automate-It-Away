<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go live · Automate It Away</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="/phone-clear.css">
  <script src="theme.js"></script>
  <script src="analytics.js"></script>
<style>
body{font-family:system-ui;margin:0;background:var(--bg);color:var(--ink)}
header{background:var(--header);color:#fff;padding:14px 5vw;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none}
.wrap{width:min(800px,92vw);margin:0 auto;padding:22px 0}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;display:block}
</style>
</head>
<body>
<header><a class="brand" href="index.html"><img class="brand-mark" src="img/aia-pyramid-header.svg" width="28" height="28" alt=""><span class="brand-name">AIA</span></a><button class="theme-btn" data-theme-btn type="button" onclick="AIATheme.cycle()">Auto</button></header>
<main class="wrap">
<h1>Before you go live</h1>
<p>Tick each one when it is true for your desk. Your ticks stay on this phone.</p>
<div id="list"></div>
</main>
<script>
const ITEMS = [
["Your desk pages","They open on this site."],
["Start with one thing","Pick one kind of work first, not everything at once."],
["Saved work","Your work is saved on the desk, not just on this phone."],
["Sign in on another phone","Use your desk name and desk code. Your work shows up there once it is saved on the desk."],
["Incoming messages","They work now and each one becomes a card. eBay and email are not on yet."],
["Desk AI drafts","A Desk AI only drafts. You tap Yes or Stop."],
["Other AI accounts","Not needed. Leave them off."]
];
const key="aia_golive";
const saved=JSON.parse(localStorage.getItem(key)||"[]");
document.getElementById("list").innerHTML = ITEMS.map((r,i)=>`<label class="item"><input type="checkbox" ${saved[i]?"checked":""} onchange="flip(${i})"> <b>${r[0]}</b> — ${r[1]}</label>`).join("");
function flip(i){const on=JSON.parse(localStorage.getItem(key)||"[]");on[i]=!on[i];localStorage.setItem(key,JSON.stringify(on));}
</script>
<script src="/mark-fix.js"></script></body></html>
