<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go live · Automate It Away</title>
<style>body{font-family:system-ui;margin:0;background:#f4f7fa;color:#1a2332}header{background:#0d6b6b;color:#fff;padding:14px 5vw}a{color:#0f7f7f}.wrap{width:min(800px,92vw);margin:0 auto;padding:22px 0}.item{background:#fff;border:1px solid #d1dae3;border-radius:12px;padding:12px;margin:8px 0}</style>
</head>
<body>
<header>Automate It Away · Pre-launch</header>
<main class="wrap">
<h1>Before go-live</h1>
<p>Do not flip production until Consign ships a real list or payout and a human owns kill + $250.</p>
<div id="list"></div>
</main>
<script>
const ITEMS = [
["Product surface","Pages in this repo."],
["First vertical","Consign — not all 16."],
["Cloud jobs","Worker + DB. localStorage is the pilot."],
["Second phone login","Workspace survives a new device."],
["One live pipe","Square or eBay writes."],
["Grok 4.6","Qualify + draft only."],
["Grok Bot","Leave off. No public API."]
];
const key="aia_golive";
document.getElementById("list").innerHTML = ITEMS.map((r,i)=>`<label class="item"><input type="checkbox" onchange="flip(${i})"> <b>${r[0]}</b> — ${r[1]}</label>`).join("");
function flip(i){const on=JSON.parse(localStorage.getItem(key)||"[]");on[i]=!on[i];localStorage.setItem(key,JSON.stringify(on));}
</script>
</body></html>
